<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des tournois · HubISoccer</title>

    <!-- ============================================================
         PAGE DE REDIRECTION

         acceuil-gt.html etait un doublon octet pour octet de
         acceuil.html. Deux pages identiques a maintenir, c'est
         une divergence garantie a la premiere modification.

         Le fichier est conserve — et non supprime — pour que les
         anciens liens, favoris et partages continuent de marcher
         au lieu de tomber en 404. Il renvoie simplement vers la
         vraie page d'accueil du dossier.

         La redirection se fait a trois niveaux, pour couvrir tous
         les cas : la balise meta refresh (fonctionne meme sans
         JavaScript), le script (instantane, et conserve les
         parametres d'URL), et le lien visible (si les deux
         precedents sont bloques).
         ============================================================ -->
    <meta http-equiv="refresh" content="0; url=acceuil.html">
    <link rel="canonical" href="acceuil.html">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="acceuil.css">
</head>
<body>

<div class="global-loader" style="display:flex;">
    <div class="loader-inner">
        <div class="spinner"></div>
        <p class="loader-text">Redirection vers l'accueil des tournois…</p>
        <p style="margin-top:12px;font-size:.85rem;">
            <a href="acceuil.html" style="color:var(--violet);font-weight:600;">
                <i class="fas fa-arrow-right"></i> Continuer maintenant
            </a>
        </p>
    </div>
</div>

<script>
    // Les parametres d'URL eventuels sont transmis a la vraie page.
    (function () {
        'use strict';
        var destination = 'acceuil.html' + window.location.search + window.location.hash;
        window.location.replace(destination);
    })();
</script>

</body>
</html>
